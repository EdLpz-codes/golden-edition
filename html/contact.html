<!DOCTYPE html>

<html>

<head>

	<meta charset="utf-8">

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" type="text/css" href="../css/style.css">

	<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<script src="../js/script.js" defer></script>

	<title> Contact </title>

</head>

<body>

<header class="site-header">

	<div class="header-brand">

		<button type="button" class="cart-button" id="cart-button" aria-label="Open shopping cart" aria-expanded="false" aria-controls="cart-panel">
			
			<i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>

				<span id="cart-count">0</span>

		</button>

		<div class="cart-panel" id="cart-panel">

			<h2> Your Shopping Cart </h2>
			
				<div id="cart-items">
					
					<p> Your cart is empty</p>

				</div>

		<br>

				<p>Total: €<span id="cart-total">0.00</span></p>

					<button type="button" id="clear-cart"> Clear cart</button>

		</div>

		<i class="fa-solid fa-book-open" aria-hidden="true"></i>

			<h1>Bookstore</h1>

				<div class="header-line"></div>

	</div>

<nav class="site-nav" aria-label="Main navigation">
	
		<a href="../index.html"><i class=""></i>Home</a>

		<a href="list.html"><i class=""></i>Catalog</a>

		<a href="gifts.html"><i class=""></i>Gift Cards & Subscriptions</a>

		<a href="Q&A.html"><i class=""></i>Q&A</a>

		<a href="contact.html" class="active" aria-current="page"><i class=""></i>Contact</a>

</nav>

</header>

<main>
	
	<section class="contact-intro">
		
		<h1>Contact Enquiry</h1>

			<p>Do you have any question?</p>

	</section>

	<section class="contact-section">

		<h2>Please send us your enquiry</h2>

		<form id="contact-form">

			<div class="form-group">

				<label for="name"> Full name: </label>
				
					<input type="text" id="name" name="name" placeholder="Enter full name" required>

			</div>

			<div class="form-group">
				
				<label for="email"> Email address: </label>

					<input type="email" id="email" name="email" placeholder="Enter email address" required>

			</div>

			<div class="form-group">
				
				<label for="phone">Phone number:</label>

					<input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>

			</div>
		
			<div class="form-group">

				<label for="query-type">Query Type: </label>
				
					<select id="query-type" name="query-type" required>

						<option value=""> Select an option </option>

						<option value="purchase"> Purchase </option>

						<option value="checklist"> Checklist </option>

						<option value="refund"> Refund </option>

						<option value="information"> General information </option>

						<option value="other"> Other </option>

					</select>

			</div>

			<div class="form-group">
				
				<label for="message"> Tell us your issue: </label>

				<textarea id="message" name="message" rows="2" minlength="20" placeholder="Write you message here..." required></textarea>

			</div>

			<button type="submit" class="submit-button"> Send </button>

			<p id="form-message" role="status" aria-live="polite"></p>

		</form>

	</section>

</main>

							<a href="Q&A.html"> Q&A </a>

							<a href="contact.html"> Contact </a>

						</nav>

			<div class="footer-divider"></div>

				<p class="footer-copyright">&copy; 2026 </p>
				

			</div>

		</footer>

</body>

</html>
